<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap">
<style>
/* Optional: put the real Apple font file in a folder named "fonts" next to this file and name it SF-Pro.ttf */
@font-face{font-family:"SFPro";font-weight:100 900;src:local("SF Pro Text"),local("SF Pro"),url("fonts/SF-Pro.ttf") format("truetype"),url("fonts/SF-Pro.otf") format("opentype")}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#111;font-family:"SFPro",-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,"Apple Color Emoji","Noto Color Emoji",sans-serif;color:#fff;overflow:hidden;user-select:none}
svg{display:block;flex:none}
/* iOS-style scrolling: tanpa scrollbar bawaan browser */
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
.chat .ms,.im-rows,.ig-scroll,.ig-feed,.gi .scr,.cp .scr,.am-sc,.md-sc,#app .page,.md-ed .bd{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scroll-behavior:auto}
#ios-sb{position:absolute;z-index:140;width:3px;border-radius:2px;background:rgba(235,235,245,.55);opacity:0;pointer-events:none;transition:opacity .35s .0s}
#ios-sb.on{opacity:1;transition:opacity .08s}
#stage{height:100%;display:flex;align-items:center;justify-content:center}
#wrap{position:relative}
#phone{position:absolute;top:0;left:0;width:390px;height:844px;border-radius:56px;border:11px solid #1b1b1d;background:#000;overflow:hidden;transform-origin:top left;box-shadow:0 0 0 2px #333,0 30px 80px rgba(0,0,0,.7)}
#screen{position:relative;width:100%;height:100%;overflow:hidden;background-size:cover;background-position:center}
#island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:100}
#status{position:absolute;top:0;left:0;right:0;height:54px;padding:16px 30px 0 34px;display:flex;justify-content:space-between;font-weight:600;font-size:16px;z-index:90;pointer-events:none;transition:color .2s}
#status .r{display:flex;gap:6px;align-items:center}
#screen.dark #status{color:#000}
#screen.dark #status svg{fill:#000}
#status svg{fill:#fff}
.view{position:absolute;inset:0;display:none}
.view.show{display:block}

/* ---------- LOCK SCREEN ---------- */
#lock .date{position:absolute;top:84px;width:100%;text-align:center;font-size:19px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.4)}
#lock .time{position:absolute;top:96px;width:100%;text-align:center;font-size:104px;font-weight:600;letter-spacing:-2px;line-height:1.1;text-shadow:0 2px 10px rgba(0,0,0,.35)}
#lock .lang{position:absolute;top:186px;width:100%;display:flex;justify-content:center;align-items:center;gap:5px;font-size:12px;font-weight:600;opacity:.9}
#notifs{position:absolute;left:12px;right:12px;bottom:110px;display:flex;flex-direction:column;gap:8px}
.notif{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:22px;background:rgba(120,120,128,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);animation:pop .4s both}
.notif .tx{flex:1;min-width:0}
.notif .tt{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.notif .tt span{font-weight:400;font-size:12px;opacity:.7}
.notif .bd{font-size:14px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
.lockbtn{position:absolute;bottom:52px;width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center}
#lock .hint{position:absolute;bottom:26px;width:100%;text-align:center;font-size:13px;opacity:.55}

/* ---------- HOME SCREEN ---------- */
#home{padding-top:64px}
.widgets{display:flex;gap:14px;padding:0 20px}
.wc{width:calc(50% - 7px);cursor:pointer}
.wl{text-align:center;font-size:12px;font-weight:500;margin-top:7px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.w{width:100%;height:158px;border-radius:26px;padding:14px 15px;position:relative}
.w.cal{background:#fff;color:#000}
.w.cal .d1{color:#ff3b30;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.2px}
.w.cal .d2{font-size:44px;font-weight:300;line-height:1.1}
.w.cal .ev{border-left:3px solid #af52de;padding-left:6px;margin-top:6px;font-size:13px;font-weight:600;line-height:1.2}
.w.cal .ev small{display:block;font-weight:400;color:#777;font-size:11px}
.w.cal .none{position:absolute;left:15px;bottom:38px;font-size:15px;color:#8e8e93}
.w.wx{background:linear-gradient(180deg,#5382bf,#4a74b4);color:#fff}
.w.wx .nl{font-size:10.5px;letter-spacing:.4px;opacity:.75;text-transform:uppercase}
.w.wx .c{font-weight:600;font-size:16px;display:flex;gap:4px;align-items:center}
.w.wx .t{font-size:50px;font-weight:300;line-height:1.05;margin-top:2px}
.w.wx .k{position:absolute;left:15px;bottom:14px;font-size:13px;font-weight:600;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px 0;padding:16px 14px 0}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.55);cursor:pointer;position:relative}
.app .i{position:relative;transition:transform .12s}
.app .ib{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.app:active .i{transform:scale(.9)}
.badge{position:absolute;top:-11px;right:-11px;min-width:25px;height:25px;border-radius:13px;background:#ff3b30;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0 7px;text-shadow:none;font-weight:500;z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.search{position:absolute;bottom:112px;left:50%;transform:translateX(-50%);padding:6px 16px;border-radius:14px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px}
.dock{position:absolute;bottom:18px;left:12px;right:12px;height:92px;border-radius:36px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;justify-content:space-around;align-items:center;padding:0 6px}
.dock .app{text-shadow:none}
.dock .app span.n{display:none}

/* ---------- APP LAYER ---------- */
#app{position:absolute;inset:0;background:#fff;color:#000;transform:translateY(100%) scale(.9);opacity:0;pointer-events:none;transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .25s;border-radius:40px;z-index:50;overflow:hidden}
#app.open{transform:none;opacity:1;pointer-events:auto;border-radius:0}
#app .page{position:absolute;inset:0;padding-top:54px;padding-bottom:30px;overflow-y:auto}
#app .page::-webkit-scrollbar{display:none}
#homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:#fff;z-index:120;cursor:pointer;box-shadow:0 0 0 12px transparent}
#homebar::after{content:"";position:absolute;inset:-14px -10px}
#screen.dark #homebar{background:#000}

/* ---------- INSTAGRAM ---------- */
.ig{--bg:#101114;--tx:#f5f5f5;--sub:#a8a8a8;--line:#2a2c31;--chip:#2a2d33;--tag:#7fa8ff}
.ig.light{--bg:#fff;--tx:#000;--sub:#737373;--line:#dbdbdb;--chip:#efefef;--tag:#00376b}
#app .page.ig{background:var(--bg);color:var(--tx);padding:0;overflow:hidden}
.ig-scroll{position:absolute;left:0;right:0;top:54px;bottom:84px;overflow-y:auto}
.ig-scroll::-webkit-scrollbar,.ig-feed::-webkit-scrollbar{display:none}
.g-top{display:flex;align-items:center;justify-content:space-between;padding:8px 16px}
.g-top .l{display:flex;gap:14px;align-items:center}
.g-top b{font-size:20px;display:flex;align-items:center;gap:5px}
.g-prof{display:flex;align-items:center;padding:6px 16px;gap:22px}
.g-av{width:84px;height:84px;border-radius:50%;border:3px solid var(--line);flex:none;background-size:cover}
.g-stats{display:flex;flex:1;justify-content:space-around;text-align:center}
.g-stats b{display:block;font-size:17px}.g-stats span{font-size:13px}
.g-bio{padding:6px 16px;font-size:13px;line-height:1.35;white-space:pre-line}
.g-btns{display:flex;gap:6px;padding:8px 16px}
.g-btns button{flex:1;height:32px;border:0;border-radius:9px;background:var(--chip);color:var(--tx);font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.g-btns button.sq{flex:none;width:38px}
.g-btns button.on{background:#0095f6;color:#fff}
.g-tabs{display:flex;border-bottom:1px solid var(--line);margin-top:8px}
.g-tabs div{flex:1;display:flex;justify-content:center;padding:10px;opacity:.4;cursor:pointer}
.g-tabs div.on{opacity:1;border-bottom:2px solid var(--tx)}
.g-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:2px}
.g-grid .t{aspect-ratio:3/4;background-size:cover;position:relative;cursor:pointer}
.g-grid .t i{position:absolute;bottom:6px;left:6px;color:#fff;font-style:normal;font-size:12px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.6);display:flex;align-items:center;gap:3px}
.g-grid .t u{position:absolute;top:7px;right:7px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.ig-empty{padding:60px 20px;text-align:center;color:var(--sub);font-size:14px}
.g-nav{position:absolute;bottom:0;left:0;right:0;height:84px;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding-top:14px}
.g-nav .me{width:26px;height:26px;border-radius:50%;background-size:cover;border:2px solid var(--tx)}
/* Instagram post feed */
.igposts{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;padding-top:54px;background:var(--bg);color:var(--tx)}
.ig-hd{display:flex;align-items:center;gap:26px;height:52px;padding:0 16px;flex:none}
.ig-hd b{font-size:20px;font-weight:600}
.ig-hd .back{cursor:pointer;display:flex}
.ig-feed{flex:1;overflow-y:auto;position:relative;padding-bottom:50px}
.post{padding-bottom:22px}
.ph{display:flex;align-items:center;gap:10px;padding:10px 14px}
.pav{width:40px;height:40px;border-radius:50%;background-size:cover;flex:none;border:2px solid var(--line)}
.ph b{font-size:15px;display:flex;align-items:center;gap:5px}
.ph .mn{margin-left:auto;display:flex;cursor:pointer}
.pm{position:relative}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;aspect-ratio:4/5;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.car>div{flex:none;width:100%;height:100%;scroll-snap-align:start;background-size:cover;background-position:center}
.cnt{position:absolute;top:14px;right:14px;background:rgba(30,30,32,.78);color:#fff;font-size:12px;padding:6px 12px;border-radius:15px;font-weight:600;pointer-events:none}
.dots{display:flex;justify-content:center;gap:4px;padding:10px 0 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--sub);opacity:.45}
.dots i.on{background:#3b82f6;opacity:1}
.acts{display:flex;align-items:center;gap:16px;padding:10px 14px 4px}
.acts .a{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.acts .bk{margin-left:auto}
.cap{padding:6px 14px 0;font-size:14px;line-height:1.35}
.cap .tag{color:var(--tag)}
.cap .more{color:var(--sub);cursor:pointer}
.ptm{padding:6px 14px 0;font-size:12.5px;color:var(--sub)}
.ptm b{color:var(--sub);font-weight:600}

/* ---------- LIST / CHAT ---------- */
.h1{font-size:32px;font-weight:700;padding:10px 18px}
.row{display:flex;align-items:center;gap:12px;padding:10px 18px;cursor:pointer;border-bottom:1px solid #f0f0f0}
.row .av{width:46px;height:46px;border-radius:50%;flex:none;background-size:cover;display:flex;align-items:center;justify-content:center}
.row .m{flex:1;min-width:0}.row .m b{display:block;font-size:15px}.row .m span{font-size:13px;color:#777;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tm{font-size:12px;color:#999}
/* ---- iOS Messages (dark) ---- */
.im-list{position:absolute;inset:0;padding-top:54px;display:flex;flex-direction:column;background:#000;color:#fff}
.im-top{display:flex;justify-content:space-between;padding:8px 20px 0;flex:none}
.im-pill{height:44px;padding:0 20px;border-radius:22px;background:rgba(44,44,46,.9);display:flex;align-items:center;font-size:17px;font-weight:500;cursor:pointer;border:1px solid rgba(255,255,255,.06)}
.im-circ{width:44px;height:44px;border-radius:50%;background:rgba(44,44,46,.9);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;border:1px solid rgba(255,255,255,.06);color:#fff}
.im-title{font-size:34px;font-weight:700;padding:10px 20px 0;letter-spacing:.2px}
.im-note{font-size:13px;color:#8e8e93;padding:0 20px 8px;border-bottom:1px solid #2c2c2e;margin:0 0 0;}
.im-rows{flex:1;overflow-y:auto;overflow-x:hidden}
.im-row{display:flex;gap:12px;padding:12px 0 0 20px;cursor:pointer}
.im-row .tx{flex:1;min-width:0;border-bottom:1px solid #2c2c2e;padding:0 20px 12px 0;margin-top:-1px}
.im-row .l1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.im-row .l1 b{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.im-row .l1 span{font-size:15px;color:#8e8e93;display:flex;align-items:center;gap:6px;flex:none}
.im-row .l2{font-size:15px;color:#8e8e93;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}
.im-row.unread .l1 span:before{content:"";width:10px;height:10px;border-radius:50%;background:#0a84ff;order:2}
.im-av{border-radius:50%;flex:none;background-size:cover;background-position:center}
.im-av.ph{background:linear-gradient(180deg,#8a8a95,#5d5d68);display:flex;align-items:center;justify-content:center}
.im-bottom{position:absolute;left:0;right:0;bottom:0;padding:10px 18px 34px;display:flex;gap:12px;background:linear-gradient(180deg,transparent,#000 40%)}
.im-search{flex:1;height:50px;border-radius:25px;background:rgba(44,44,46,.9);display:flex;align-items:center;gap:10px;padding:0 18px;color:#8e8e93;font-size:19px;border:1px solid rgba(255,255,255,.06)}
.im-search svg:last-child{margin-left:auto}
.im-bottom .im-circ{width:50px;height:50px}

.chat{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;padding-top:0;z-index:3;color:#fff}
.chat .hd{position:absolute;left:0;right:0;top:0;z-index:4;display:flex;flex-direction:column;align-items:center;gap:0;padding:62px 16px 6px;pointer-events:none}
.chat .hd::before{content:"";position:absolute;left:0;right:0;top:0;height:calc(100% + 30px);z-index:-1;pointer-events:none;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:linear-gradient(180deg,rgba(0,0,0,.8) 0%,rgba(0,0,0,.55) 62%,rgba(0,0,0,0) 100%);-webkit-mask-image:linear-gradient(180deg,#000 66%,transparent 100%);mask-image:linear-gradient(180deg,#000 66%,transparent 100%)}
.chat .hd .back,.chat .hd .vid,.chat .hd .hdc{pointer-events:auto}
.chat .back{position:absolute;left:19px;top:62px;cursor:pointer;width:42px;height:42px;border-radius:50%;background:rgba(58,58,62,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;z-index:2}
.chat .vid{position:absolute;right:19px;top:62px;width:42px;height:42px;border-radius:50%;background:rgba(58,58,62,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;z-index:2}
.chat .nm{display:flex;align-items:center;gap:3px;padding:5px 14px;border-radius:18px;background:rgba(58,58,62,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:15.5px;font-weight:600;margin-top:-4px;border:1px solid rgba(255,255,255,.08)}
.chat .nm i{font-style:normal;color:#8e8e93;font-size:13px}
.chat .ms{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 20px 10px;display:flex;flex-direction:column;gap:4px}
.chat .stamp{align-self:center;text-align:center;font-size:10.4px;color:#8e8e93;margin:15px 0 4px;line-height:12.5px}
.chat .stamp svg{display:inline-block;vertical-align:-1px;margin-right:2px}
.bub{position:relative;max-width:75%;padding:9.5px 11.5px;border-radius:17px;font-size:13.2px;line-height:15.8px;animation:pop .25s both;word-wrap:break-word;user-select:text}
.bub.them{background:#262628;align-self:flex-start;color:#fff}
.bub.me{background:#34c759;align-self:flex-end;color:#fff}
.chat.imsg .bub.me{background:#0a84ff}
.bub.gap{margin-top:6px}
.bub.jumbo{background:transparent!important;padding:0;font-size:52px;line-height:1.15}
.bub.jumbo::before,.bub.jumbo::after{display:none!important}
.bub.tail.me::before,.bub.tail.them::before,.bub.tail.me::after,.bub.tail.them::after{content:"";position:absolute;bottom:0;height:18px}
.bub.tail.me::before{right:-7px;width:20px;background:inherit;border-bottom-left-radius:16px 14px}
.bub.tail.me::after{right:-26px;width:26px;background:#000;border-bottom-left-radius:10px}
.bub.tail.them::before{left:-7px;width:20px;background:inherit;border-bottom-right-radius:16px 14px}
.bub.tail.them::after{left:-26px;width:26px;background:#000;border-bottom-right-radius:10px}
.chat .in{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:center;gap:12px;padding:8px 27px 26px}
.chat .in::before{content:"";position:absolute;left:0;right:0;bottom:0;top:-26px;z-index:-1;pointer-events:none;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:linear-gradient(0deg,rgba(0,0,0,.8) 0%,rgba(0,0,0,.55) 62%,rgba(0,0,0,0) 100%);-webkit-mask-image:linear-gradient(0deg,#000 66%,transparent 100%);mask-image:linear-gradient(0deg,#000 66%,transparent 100%)}
.chat .in .plus{width:38px;height:38px;border-radius:50%;background:rgba(58,58,62,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;flex:none}
.chat .field{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:38px;border-radius:19px;background:rgba(58,58,62,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:0 6px 0 16px;border:1px solid rgba(255,255,255,.08)}
.chat input{flex:1;min-width:0;border:0;background:transparent;color:#fff;font-size:13.2px;outline:none;font-family:inherit;user-select:text}
.chat input::placeholder{color:#8e8e93}
.chat .field .act{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:#8e8e93;cursor:pointer}
.chat .field .act.send{background:#34c759;color:#fff;display:none}
.chat.imsg .field .act.send{background:#0a84ff}
.chat .field.has .act.send{display:flex}
.chat .field.has .act.wave{display:none}

/* ---------- REPLIES (threads) ---------- */
.chat .stamp b{font-weight:600}
.thr{display:flex;flex-direction:column}
.thr.me{align-self:flex-end;align-items:flex-end}
.thr.them{align-self:flex-start;align-items:flex-start}
.thr.plain{max-width:75%}
.thr.plain .bub{max-width:none}
.thr.hasq{align-self:stretch;align-items:stretch}
.thr.hasq.ing{align-self:flex-start;align-items:flex-start;max-width:100%}
.qblock{display:flex;flex-direction:column;max-width:75%}
.qblock.them{align-self:flex-start;align-items:flex-start}
.qblock.me{align-self:flex-end;align-items:flex-end}
.qb{position:relative;border:1px solid #3a3a3c;border-radius:13px;padding:5px 10px;font-size:10.4px;line-height:12.5px;color:#a1a1a8;word-wrap:break-word}
.qb .qt{position:absolute;left:-3px;bottom:-1px}
.qblock.me .qb .qt{left:auto;right:-3px;transform:scaleX(-1)}
.rc{font-size:10.4px;line-height:12.5px;color:#4a8ef5;margin:7px 0 8px 19px;cursor:default}
.qblock .rc{margin-left:28px}
.qblock.me .rc{margin-left:0;margin-right:28px}

    articles: [
      { pinned: true, title: "Pixel Skies & Phantom Echoes: A Descent Into Virtual Dreams.",
        date: "Feb 16", fullDate: "Feb 16, 2026", readTime: "2 min read", image: "sl.jpg",
        body: [
          "Gema Sangkara Yuda was born in Jakarta on June 13, 2003, into a family where the spotlight was less a dream than a family business. Cameras, scripts, and call sheets were part of his childhood the way cartoons were for other kids. He never had to ask for anything. He went to an international school, and his weekends were packed with expensive private classes in modeling, acting, and vocals. By the time other children were learning to ride a bike without training wheels, Gema had already learned how to hit his mark and smile on cue.",
          "He was good at it. That was the problem. Nobody ever asked if he wanted to be.",
          "In 2015, when he was twelve, his father moved out for good. On paper the divorce was clean. In Gema's chest it was not. After that, the house held only him and his mother, and it felt a size too big. He learned to keep his voice small and his wants smaller, because his mother was carrying enough already.",
          "In 2019, as he was about to graduate from junior high, Gema applied to a well-known production house. He treated it as a formality, something to tick off so everyone would stop asking. Instead, they invited him to audition as both a soloist and an actor.",
          "He told his mother no. She asked again, and then again. By the third night she was in tears, and by the fifth she said the thing that settled it: “If you don't go, you'll regret it for the rest of your life.",
          "Gema did not believe her. But he also could not stand to be one more person who let her down. So he went, arms crossed, expectations buried, fully intending to be eliminated in the first round and go home.",
          "The audition turned out to be a survival show: months of eliminations, sleepless rehearsals, and a room full of trainees who all wanted the same few spots. Gema planned to keep his head down and survive on talent alone.",
          "He had not planned on the boy who dropped onto the practice room floor beside him on the very first night, uninvited, grinning like they already knew each other.",
          "“You look like you hate it here,” the boy said. “Me too. Want to hate it together?”",
          "His name was Sadha. He was five months younger than Gema, and he was loud where Gema was guarded, warm where Gema was careful. Gema meant to roll his eyes. Instead he laughed, a real one, and realized with some alarm that it was the first time in months.",
          "After that, Sadha was simply always there. Stretching beside him at dawn. Splitting convenience-store snacks at midnight. Covering for Gema's mistakes in choreography without ever mentioning it. When the final lineup was announced and both of their names were on it, Gema looked sideways before he even looked at the screen, because he wanted to see Sadha's face first.",
          "They debuted together, a soloist and as an actor, under the same roof. Everyone called it a dream come true. For once, Gema agreed.",
          "When you do everything with one person, you stop noticing that “with Sadha” has become the default setting of your life. Gema did not feel his feelings arrive. They settled in quietly, like a song he had hummed for so long that he forgot when he learned it.",
          "He noticed the small things first. That he checked his phone for Sadha's name before anyone else's. That a stage felt colder when Sadha was not in the wings. That his heart did something unreasonable every time Sadha laughed with his whole face.",
          "By the time Gema understood what it was, it was already too late to unlearn it.",
          "So he did what he had always done. He asked for nothing and said nothing, and he kept smiling on cue.",
          "Sadha pulled away first. It happened slowly, and Gema noticed every inch of it. Sadha's replies got shorter. He found reasons to sit on the other side of the van. When Gema finally worked up the nerve to say something, even a clumsy half-confession, Sadha's answer came fast and rehearsed: “You're my best friend. It's just the job. It's just that we're close.”",
          "Gema nodded. He said, “Yeah, of course.” He went home and sat on his bathroom floor for a long time, telling himself this was what he deserved for asking for too much. He had survived a divorce by never asking for too much, and he had broken his own rule.",
          "For weeks they were polite strangers in the same company. Gema performed beside him every day and felt the gap like a draft.",
          "Then, one rainy night, someone knocked on the door of his apartment. Sadha stood in the hallway soaked to the bone, with no umbrella and no excuses.",
          "“I'm not scared of liking you,” Sadha said, and his voice cracked on it. “I'm scared of losing you. I've been scared for months, and I'm so tired of it.”",
          "Gema did not remember deciding to step forward. He only remembered that the door stayed open and Sadha came in."
        ] },

    gr.addColorStop(0, cols[i % 5]); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.globalAlpha = .55; g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  g.globalAlpha = 1;
  for (let i = 0; i < 700; i++) {
    g.fillStyle = cols[i % 5]; g.globalAlpha = .3 + Math.random() * .6;
    g.fillRect(Math.random() * 390, Math.random() * 844, 1 + Math.random(), 1 + Math.random());
  }
  return `url(${c.toDataURL()})`;
}

/* ---------- Music player (shared by the Music app and Control Center) ---------- */
const PLAYER = (() => {
  const M = CONFIG.music;
  const tracks = (M.tracks && M.tracks.length) ? M.tracks : [{ title: M.title, artist: M.artist, src: null, cover: M.color }];
  const audio = new Audio(); audio.preload = 'metadata';
  /* built-in demo melody, used when a track has no src */
  const MEL = [72,76,79,76,81,79,76,72, 74,77,81,77,79,77,74,71, 72,76,79,84,83,79,76,79, 77,74,71,74,72,67,72,72];
  const BASS = [48,55,53,43,48,55,53,43];
  const STEP = .5, DEMO_LEN = MEL.length * STEP;
  let idx = 0, playing = false, started = false, vol = M.volume != null ? M.volume : .7, subs = [];
  let ctx = null, master = null, nodes = [], pos = 0, t0 = 0;
  const T = () => tracks[idx];
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  function note(m, start, dur, type, lvl) {
    if (start + dur <= pos) return;
    const now = ctx.currentTime, at = t0 + start, when = Math.max(at, now);
    const len = Math.max(.08, dur - Math.max(0, now - at));
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = hz(m);
    g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(lvl, when + .02);
    g.gain.exponentialRampToValueAtTime(.001, when + len);
    o.connect(g); g.connect(master); o.start(when); o.stop(when + len + .02);
    nodes.push(o);
  }
  function synthPlay() {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    master = ctx.createGain(); master.gain.value = vol * .5; master.connect(ctx.destination);
    t0 = ctx.currentTime - pos;
    MEL.forEach((m, i) => note(m, i * STEP, STEP * .95, 'triangle', .5));
    BASS.forEach((m, i) => note(m, i * 2, 1.9, 'sine', .6));
  }
  function synthStop() {
    nodes.forEach(n => { try { n.stop(); } catch (e) {} }); nodes = [];
    if (master) { master.disconnect(); master = null; }
  }
  const cur = () => T().src ? (audio.currentTime || 0) : (playing && ctx ? Math.min(DEMO_LEN, ctx.currentTime - t0) : pos);
  const dur = () => T().src ? (audio.duration || 0) : DEMO_LEN;
  function emit(k) { subs.forEach(f => f(k || 'state')); }
  function halt() {
    audio.pause();
    if (!T().src && playing && ctx) pos = Math.min(DEMO_LEN, ctx.currentTime - t0);
    synthStop();
  }
  function load(i) {
    halt(); playing = false; pos = 0;
    idx = (i + tracks.length) % tracks.length;
    if (T().src) { audio.src = T().src; audio.volume = vol; }
  }
  function play() {
    started = true; playing = true;
    if (T().src) {
      audio.volume = vol;
      const pr = audio.play();
      if (pr && pr.catch) pr.catch(() => { playing = false; emit(); });
    } else synthPlay();
    emit();
  }
  function pause() { halt(); playing = false; emit(); }
  function seek(f) {
    f = Math.max(0, Math.min(1, f));
    if (T().src) { if (audio.duration) audio.currentTime = f * audio.duration; }
    else { const was = playing; halt(); playing = false; pos = f * DEMO_LEN; if (was) play(); }
    emit('tick');
  }
  function next() { load(idx + 1); play(); }
  function prev() { if (cur() > 3) seek(0); else { load(idx - 1); play(); } }
  if (T().src) { audio.src = T().src; audio.volume = vol; }
  audio.addEventListener('ended', next);
  audio.addEventListener('error', () => { playing = false; emit(); });
  setInterval(() => {
    if (!playing) return;
    if (!T().src && cur() >= DEMO_LEN) { next(); return; }
    emit('tick');
  }, 250);
  return {
    tracks,
    get track() { return T(); }, get index() { return idx; },
    get playing() { return playing; }, get started() { return started; },
    get current() { return cur(); }, get duration() { return dur(); },
    get volume() { return vol; },
    play, pause, next, prev, seek,
    toggle() { playing ? pause() : play(); },
    select(i) { load(i); play(); },
    setVolume(v) { vol = Math.max(0, Math.min(1, v)); audio.volume = vol; if (master) master.gain.value = vol * .5; },
    onChange(fn) { subs.push(fn); return () => { subs = subs.filter(f => f !== fn); }; }
  };
})();

      $('.plus', ov).onclick = () => pickImage(u => { pending = u; paintAtt(); inp.focus(); });
      inp.oninput = sync;
      const send = () => {
        const t = inp.value.trim(); if (!t && !pending) return;
        if (pending) { const pm = { from: 'me', image: pending }; c.messages.push(pm); add(pm); pending = ''; paintAtt(); }
        if (t) { const m = { from: 'me', text: t }; c.messages.push(m); add(m); inp.value = ''; }
        sync();
        setTimeout(() => { const r = { from: 'them', text: CONFIG.replies[Math.floor(Math.random() * CONFIG.replies.length)] }; if (c.members && c.members.length) r.who = c.members[Math.floor(Math.random() * c.members.length)].id; c.messages.push(r); add(r); }, 900);
      };
      $('.send', ov).onclick = send; inp.onkeydown = e => { if (e.key === 'Enter') send(); };
      $('.back', ov).onclick = () => { ov.remove(); showList(); };
      if (c.members) hdc.onclick = () => openInfo(c, ov, () => { paintHd(); rebuild(); });
      else hdc.onclick = () => openProfile(c, null, ov, () => {});
      appEl.appendChild(ov);
      ms.style.paddingTop = $('.hd', ov).offsetHeight + 8 + 'px'; ms.style.paddingBottom = $('.in', ov).offsetHeight + 10 + 'px';

  /* ======================= CALENDAR ======================= */
  calendar(p) {
    let d = new Date(), y = d.getFullYear(), m = d.getMonth();
    const today = new Date();
    const draw = () => {
      const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
      const evs = CONFIG.events.filter(a => { const t = new Date(a.date + 'T00:00:00'); return t.getFullYear() === y && t.getMonth() === m; });
      const evDays = evs.map(a => new Date(a.date + 'T00:00:00').getDate());
      let cells = ['S','M','T','W','T','F','S'].map(h => `<div class="hh">${h}</div>`).join('') + '<div></div>'.repeat(first);
      for (let i = 1; i <= days; i++) {
        const isT = i === today.getDate() && m === today.getMonth() && y === today.getFullYear();
        cells += `<div class="dd ${isT ? 'today' : ''} ${evDays.includes(i) ? 'ev' : ''}"><span>${i}</span></div>`;
      }
      p.innerHTML = `<div class="cal-h"><span id="pv">${ico('back', 24, { sw: 2.2 })}</span><b>${MONTH[m]} ${y}</b><span id="nx">${ico('chevR', 24, { sw: 2.2 })}</span></div><div class="cal-g">${cells}</div>
      <div class="cal-l">${evs.length ? evs.map(a => `<div><b>${MONTH[m]} ${new Date(a.date + 'T00:00:00').getDate()}</b><br>${esc(a.title)}</div>`).join('') : '<span style="color:#999">No events this month</span>'}</div>`;
      $('#pv', p).onclick = () => { m--; if (m < 0) { m = 11; y--; } draw(); };
      $('#nx', p).onclick = () => { m++; if (m > 11) { m = 0; y++; } draw(); };
    };
    draw();
  },

      el.onpointerup = e => { if (!d) return; d = false; onEnd(f(e)); };

    drawSc(true); drawTop(); drawTabs(); paintMini(); paintNp('state');
    cleanup = P.onChange(kind => {
      if (kind !== 'tick') { drawSc(); paintMini(); }
      paintNp(kind);

            cv.getContext('2d').drawImage(im, (im.width - k) / 2, (im.height - k) / 2, k, k, 0, 0, 256, 256);

          followers: Math.max(0, parseInt($('#edf', ov).value, 10) || 0), following: Math.max(0, parseInt($('#edg', ov).value, 10) || 0)

  /* ======================= PHOTOS ======================= */
  photos(p) {
    const list = CONFIG.photos.map(f => typeof f === 'string' ? { src: f } : f);
    const isVid = f => f.type === 'video' || /\.(mp4|mov|m4v|webm|ogv)([?#].*)?$/i.test(f.src);
    const vsrc = f => f.src + '#t=0.1';
    const fmtT = t => { t = Math.max(0, Math.round(t || 0)); return Math.floor(t / 60) + ':' + pad2(t % 60); };
    p.innerHTML = `<div class="h1">Photos</div><div class="phg">${list.map((f, i) => isVid(f) ? `<div data-i="${i}"><video muted playsinline preload="metadata" src="${esc(vsrc(f))}"${f.poster ? ` poster="${esc(f.poster)}"` : ''}></video><span class="phd">0:00</span></div>` : `<div data-i="${i}" style="background:${bg(f.src)}"></div>`).join('')}</div>`;
    p.querySelectorAll('.phg>div').forEach(t => { const v = t.querySelector('video'); if (v) v.onloadedmetadata = () => { t.querySelector('.phd').textContent = fmtT(v.duration); }; });
    const K = () => screen.getBoundingClientRect().width / screen.offsetWidth || 1;
    const isG = v => /^(linear|radial|#|rgb)/.test(v);
    const sv = (inner, w) => `<svg viewBox="0 0 24 24" width="${w || 22}" height="${w || 22}" fill="none" stroke="#fff" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
    const I = {
      back: ico('back', 22, { sw: 2.600, stroke: '#fff' }),
      dots: sv('<circle cx="5.500" cy="12" r="1.200" fill="#fff"/><circle cx="12" cy="12" r="1.200" fill="#fff"/><circle cx="18.500" cy="12" r="1.200" fill="#fff"/>', 24),
      share: sv('<path d="M12 15V3.500M8 7l4-3.800L16 7"/><path d="M7.500 10H6.200A1.700 1.700 0 0 0 4.500 11.700v7.600A1.700 1.700 0 0 0 6.200 21h11.600a1.700 1.700 0 0 0 1.700-1.700v-7.600A1.700 1.700 0 0 0 17.800 10h-1.300"/>', 23),
      heart: sv('<path d="M12 20.200S3.800 15.200 3.800 9.200A4.500 4.500 0 0 1 12 6.700a4.500 4.500 0 0 1 8.200 2.500c0 6-8.200 11-8.200 11z"/>', 25),
      info: sv('<circle cx="12" cy="12" r="9.200"/><path d="M12 11v5.500"/><circle cx="12" cy="7.700" r=".6" fill="#fff"/>', 26),
      adj: sv('<path d="M3.500 8h6M14.500 8h6M3.500 16h10M18 16h2.500"/><circle cx="12" cy="8" r="2.400"/><circle cx="15.600" cy="16" r="2.400"/>', 26),
      trash: sv('<path d="M4.500 7h15M9.500 7V4.800h5V7M6.500 7l.8 12.500h9.400L17.500 7M10 10.500v6M14 10.500v6"/>', 23)
    };
    const open = (start, tile) => {
      let idx = start, dx = 0, busy = true, sx = 0, drag = false, moved = 0;
      const favs = new Set(), wasDark = screen.classList.contains('dark');
      const ov = document.createElement('div'); ov.className = 'pv';
      const now = new Date(), clk = pad2(now.getHours()) + '.' + pad2(now.getMinutes());
      ov.innerHTML = `<div class="pvbg"></div>
        <div class="pvst"><div class="pvtr">${list.map(f => isVid(f) ? `<div class="pvs vid"><video playsinline preload="metadata" src="${esc(vsrc(f))}"${f.poster ? ` poster="${esc(f.poster)}"` : ''}></video></div>` : `<div class="pvs">${isG(f.src) ? `<div class="pvg" style="background:${f.src}"></div>` : `<img src="${esc(f.src)}" draggable="false" alt="">`}</div>`).join('')}</div></div>
        <div class="pvui pvsc"><span class="pvb" data-a="pp"></span><div class="bar"><i></i></div><span class="pvb" data-a="mute"></span></div>
        <div class="pvui pvtop"><span class="pvc" data-a="back">${I.back}</span><span class="pvdt"><b></b><i></i></span><span class="pvc">${I.dots}</span></div>
        <div class="pvui pvfs">${list.map((f, i) => `<div class="pvt" data-i="${i}"${isVid(f) ? `><video muted preload="metadata" src="${esc(vsrc(f))}"${f.poster ? ` poster="${esc(f.poster)}"` : ''}></video></div>` : ` style="background:${bg(f.src)}"></div>`}`).join('')}</div>
        <div class="pvui pvbt"><span class="pvc big">${I.share}</span><span class="pvpl"><span data-a="fav">${I.heart}</span><span>${I.info}</span><span>${I.adj}</span></span><span class="pvc big">${I.trash}</span></div>`;
      appEl.appendChild(ov);
      screen.classList.remove('dark');
      const tr = $('.pvtr', ov), st = $('.pvst', ov), fs = $('.pvfs', ov), ts = [...fs.children];
      const W = () => st.clientWidth;
      const vidOf = i => { const e = tr.children[i]; return e && e.classList.contains('vid') ? e.querySelector('video') : null; };
      let muted = false;
      const SPK = '<path d="M3.500 9.500h3.300L11.500 5.800v12.400L6.800 14.500H3.500z" fill="#fff"/>';
      const paintMute = () => { $('[data-a=mute]', ov).innerHTML = `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round">${SPK}${muted ? '<path d="M15.500 9.500l5 5M20.500 9.500l-5 5"/>' : '<path d="M14.600 9.200a4.200 4.200 0 0 1 0 5.600M17.200 6.600a8 8 0 0 1 0 10.800"/>'}</svg>`; tr.querySelectorAll('video').forEach(v => { v.muted = muted; }); };
      const sc = $('.pvsc', ov), bar = $('.bar', sc), fill = $('i', bar);
      const PLAY = '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M7.500 5.200v13.600c0 .8.9 1.300 1.600.9l10.400-6.800c.6-.4.6-1.300 0-1.700L9.100 4.300c-.7-.4-1.600.1-1.600.9z" fill="#fff"/></svg>', PAUSE = '<svg viewBox="0 0 24 24" width="22" height="22"><rect x="6" y="4.500" width="4.200" height="15" rx="1.200" fill="#fff"/><rect x="13.800" y="4.500" width="4.200" height="15" rx="1.200" fill="#fff"/></svg>';
      const tick = () => { const v = vidOf(idx); if (!v) return; const d = v.duration || 0; fill.style.width = d ? (v.currentTime / d * 100) + '%' : '0%'; $('[data-a=pp]', sc).innerHTML = v.paused ? PLAY : PAUSE; };
      const stopAll = () => [...tr.querySelectorAll('video')].forEach(v => { v.pause(); v.parentNode.classList.remove('on'); });
      tr.querySelectorAll('video').forEach(v => { v.ontimeupdate = tick; v.onloadedmetadata = tick; v.onplay = tick; v.onpause = tick; v.onended = () => { v.parentNode.classList.remove('on'); tick(); }; });
      const toggleVid = () => { const v = vidOf(idx); if (!v) return false; if (v.paused) { const pr = v.play(); if (pr && pr.catch) pr.catch(() => {}); v.parentNode.classList.add('on'); } else { v.pause(); v.parentNode.classList.remove('on'); } return true; };
      const seek = e => { const v = vidOf(idx); if (!v || !v.duration) return; const r = bar.getBoundingClientRect(); v.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * v.duration; tick(); };
      let sk = false; bar.onpointerdown = e => { sk = true; bar.setPointerCapture(e.pointerId); seek(e); e.stopPropagation(); }; bar.onpointermove = e => { if (sk) seek(e); }; bar.onpointerup = bar.onpointercancel = () => { sk = false; };
      const paint = anim => {
        tr.style.transition = anim ? 'transform .32s cubic-bezier(.2,.8,.2,1)' : 'none';
        tr.style.transform = `translateX(${-idx * W() + dx}px)`;
      };
      const sync = (smooth) => {
        const f = list[idx];
        $('.pvdt b', ov).textContent = f.date || 'Today'; $('.pvdt i', ov).textContent = f.time || clk;
        ts.forEach((t, i) => t.classList.toggle('on', i === idx));
        const t = ts[idx]; fs.scrollTo({ left: t.offsetLeft - fs.clientWidth / 2 + 14, behavior: smooth ? 'smooth' : 'auto' });
        $('[data-a=fav] svg', ov).setAttribute('fill', favs.has(idx) ? '#ff375f' : 'none');
        $('[data-a=fav] svg', ov).setAttribute('stroke', favs.has(idx) ? '#ff375f' : '#fff');
      };
      const go = (i, anim = true) => { const old = idx; idx = Math.max(0, Math.min(list.length - 1, i)); dx = 0; if (old !== idx) stopAll(); ov.classList.toggle('hasvid', !!vidOf(idx)); tick(); paint(anim); sync(anim); };
      const fly = (im, r, out) => {                       // move the photo between the grid thumbnail and full screen
        const k = K(), a = r.getBoundingClientRect(), b = im.getBoundingClientRect();
        const sc = a.width / b.width, tx = (a.left + a.width / 2 - b.left - b.width / 2) / k, ty = (a.top + a.height / 2 - b.top - b.height / 2) / k;
        const from = `translate(${tx}px,${ty}px) scale(${sc})`;
        if (!out) { im.style.transition = 'none'; im.style.transform = from; im.style.borderRadius = '8px'; im.offsetWidth; }
        im.style.transition = 'transform .34s cubic-bezier(.2,.8,.2,1), border-radius .34s';
        im.style.transform = out ? from : 'none'; im.style.borderRadius = out ? '8px' : '0';
      };
      const close = () => {
        if (busy) return; busy = true; document.removeEventListener('keydown', key);
        stopAll(); const im = tr.children[idx].firstElementChild, r = p.querySelectorAll('.phg>div')[idx];
        ov.classList.remove('in'); fly(im, r, true);
        setTimeout(() => { ov.remove(); if (wasDark) screen.classList.add('dark'); }, 340);
      };
      const key = e => { if (!ov.isConnected) return document.removeEventListener('keydown', key); if (e.key === 'Escape') close(); else if (e.key === 'ArrowLeft') go(idx - 1); else if (e.key === 'ArrowRight') go(idx + 1); };
      document.addEventListener('keydown', key);
      st.addEventListener('pointerdown', e => { if (busy) return; drag = true; sx = e.clientX; moved = 0; st.setPointerCapture(e.pointerId); });
      st.addEventListener('pointermove', e => {
        if (!drag) return; dx = (e.clientX - sx) / K(); moved = Math.max(moved, Math.abs(dx));
        if ((idx === 0 && dx > 0) || (idx === list.length - 1 && dx < 0)) dx /= 3;
        paint(false);
      });
      const end = e => { if (!drag) return; drag = false; if (e && e.type === 'pointerup' && moved < 6 && toggleVid()) { dx = 0; paint(false); return; } go(Math.abs(dx) > 50 ? idx + (dx < 0 ? 1 : -1) : idx); };
      st.addEventListener('pointerup', end); st.addEventListener('pointercancel', end);
      ov.onclick = e => {
        const a = e.target.closest('[data-a]'), t = e.target.closest('.pvt');
        if (a && a.dataset.a === 'back') close();
        else if (a && a.dataset.a === 'fav') { favs.has(idx) ? favs.delete(idx) : favs.add(idx); sync(false); }
        else if (a && a.dataset.a === 'mute') { muted = !muted; paintMute(); }
        else if (a && a.dataset.a === 'pp') { toggleVid(); tick(); }
        else if (t) go(+t.dataset.i);
      };
      paintMute();
      go(start, false);
      tr.style.opacity = 0;
      const im = tr.children[start].firstElementChild;
      Promise.race([im.decode ? im.decode().catch(() => {}) : new Promise(r => { if (im.readyState >= 2) r(); else { im.addEventListener('loadeddata', r, { once: true }); im.addEventListener('error', r, { once: true }); } }), new Promise(r => setTimeout(r, 900))]).then(() => {
        tr.style.opacity = 1; fly(im, tile, false); ov.classList.add('in');
        setTimeout(() => { busy = false; }, 360);
      });
    };
    p.querySelectorAll('.phg>div').forEach(t => t.onclick = () => open(+t.dataset.i, t));
  },
  /* ======================= SETTINGS ======================= */
  settings(p) {
    const cfg = CONFIG.settings || {}, KEY = 'settingsProfile', sig = JSON.stringify([cfg.name, cfg.subtitle, cfg.photo]);
    const prof = { name: cfg.name || '', sub: cfg.subtitle || '', photo: cfg.photo || '' };
    try { const sv = JSON.parse(localStorage.getItem(KEY) || 'null'); if (sv && sv.sig === sig) Object.assign(prof, sv.prof); } catch (e) {}
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ sig, prof })); } catch (e) {} };
    const g = (inner, vb) => `<svg viewBox="${vb || '0 0 24 24'}" width="17" height="17">${inner}</svg>`;
    const S = (d, w) => `fill="none" stroke="#fff" stroke-width="${w || 1.8}" stroke-linecap="round" stroke-linejoin="round" d="${d}"`;
    const rays = n => [...Array(n)].map((_, i) => `<path d="M12 2.600v2.400" stroke="#fff" stroke-width="1.800" stroke-linecap="round" transform="rotate(${i * 360 / n} 12 12)"/>`).join('');
    const gear = [...Array(8)].map((_, i) => `<path d="M12 2.800v3" stroke="#fff" stroke-width="2.600" stroke-linecap="round" transform="rotate(${i * 45} 12 12)"/>`).join('');

<script>
(function () {
  /* ===== PENGATURAN SCROLL (boleh diubah) ===== */
  var GESER_MOUSE = true;   // true = bisa digeser dengan mouse seperti jari (ada momentum). false = hanya roda mouse
  var GESEKAN = 0.95;       // makin dekat 1 makin licin/lama meluncur (iOS sekitar 0.95)
  var TAMPIL_BAR = 900;     // berapa milidetik indikator scroll tampil setelah berhenti
  /* ============================================ */
  var scr = document.getElementById('screen');
  var sb = document.createElement('div'); sb.id = 'ios-sb'; scr.appendChild(sb);
  var hideT = null;

  function scaleK() { return scr.getBoundingClientRect().width / scr.offsetWidth || 1; }
  function scroller(el) {
    while (el && el !== document.body) {
      if (el.nodeType === 1) {
        var cs = getComputedStyle(el);
        if (cs.touchAction === 'none') return null;
        if ((cs.overflowY === 'auto' || cs.overflowY === 'scroll') && el.scrollHeight > el.clientHeight + 1) return el;
      }
      el = el.parentElement;
    }
    return null;
  }

  /* Indikator tipis ala iOS: muncul saat menggulir lalu memudar */
  function showBar(el) {
    if (!el || el.scrollHeight <= el.clientHeight + 1 || !scr.contains(el)) return;
    var r = el.getBoundingClientRect(), s = scr.getBoundingClientRect(), k = scaleK();
    var h = el.clientHeight, inset = 6, room = h - inset * 2;
    var bh = Math.max(36, room * h / el.scrollHeight);
    var max = el.scrollHeight - h, f = max > 0 ? Math.min(1, Math.max(0, el.scrollTop / max)) : 0;
    sb.style.height = bh + 'px';
    sb.style.left = ((r.right - s.left) / k - 6) + 'px';
    sb.style.top = ((r.top - s.top) / k + inset + f * (room - bh)) + 'px';
    sb.classList.add('on');
    clearTimeout(hideT); hideT = setTimeout(function () { sb.classList.remove('on'); }, TAMPIL_BAR);
  }
  document.addEventListener('scroll', function (e) {
    var t = e.target; if (t && t.nodeType === 1) showBar(t);
  }, true);

  if (!GESER_MOUSE) return;

  /* Geser dengan mouse + momentum (seperti jari di layar sentuh) */
  var d = null, raf = null;
  function stopInertia() { if (raf) cancelAnimationFrame(raf); raf = null; }
  scr.addEventListener('pointerdown', function (e) {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    if (e.target.closest('input,textarea,select,[contenteditable],#at-btn,#at-ov,.car')) return;
    stopInertia();
    var el = scroller(e.target); if (!el) return;
    d = { el: el, y0: e.clientY, s0: el.scrollTop, k: scaleK(), last: e.clientY, t: performance.now(), v: 0, moved: false };
  });
  window.addEventListener('pointermove', function (e) {
    if (!d) return;
    var dy = e.clientY - d.y0;
    if (!d.moved && Math.abs(dy) < 6) return;
    d.moved = true;
    var now = performance.now(), dt = Math.max(1, now - d.t);
    d.v = 0.8 * d.v + 0.2 * ((d.last - e.clientY) / d.k / dt * 16);
    d.last = e.clientY; d.t = now;
    d.el.scrollTop = d.s0 - dy / d.k;
    getSelection().removeAllRanges();
    e.preventDefault();
  }, { passive: false });
  function end() {
    if (!d) return;
    var el = d.el, v = d.v, moved = d.moved, idle = performance.now() - d.t; d = null;
    if (!moved) return;
    var kill = function (ev) { ev.stopPropagation(); ev.preventDefault(); };
    window.addEventListener('click', kill, true);
    setTimeout(function () { window.removeEventListener('click', kill, true); }, 0);
    if (idle > 120) return;
    (function step() {
      if (Math.abs(v) < 0.15) { raf = null; return; }
      var before = el.scrollTop; el.scrollTop += v; v *= GESEKAN;
      if (el.scrollTop === before) { raf = null; return; }
      raf = requestAnimationFrame(step);
    })();
  }
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);
  scr.addEventListener('wheel', stopInertia, { passive: true });
  scr.addEventListener('dragstart', function (e) { e.preventDefault(); });

</script>

<style>

<script>
(function () {
  /* ===== PENGATURAN EMOJI GAMBAR (boleh diubah) ===== */
  var FOLDER = "emoji/";    // nama folder berisi gambar emoji, ditaruh di sebelah index.html
  var EKSTENSI = ".png";    // jenis file gambar
  var AKTIF = true;         // false = pakai emoji bawaan perangkat lagi
  /* ================================================== */
  if (!AKTIF) return;
  var RE = /\p{Regional_Indicator}{2}|[#*0-9]️?⃣|\p{Extended_Pictographic}(?:️|\p{Emoji_Modifier}|‍\p{Extended_Pictographic}️?|[\u{E0020}-\u{E007F}])*/gu;
  var gagal = Object.create(null);
  var root = document.getElementById('screen') || document.body;

  function nama(s, denganFE0F) {
    var cp = [];
    for (var ch of s) { var c = ch.codePointAt(0); if (c === 0xFE0F && !denganFE0F) continue; cp.push(c.toString(16)); }
    return cp.join('-');
  }
  function buat(emo) {
    var a = nama(emo, false), b = nama(emo, true);
    if (gagal[emo]) return null;
    var img = document.createElement('img');
    img.className = 'emo'; img.alt = emo; img.draggable = false;
    var coba = a === b ? [a] : [a, b], i = 0;
    img.onerror = function () {
      i++;
      if (i < coba.length) { img.src = FOLDER + coba[i] + EKSTENSI; return; }
      gagal[emo] = 1;                       // gambar tidak ada: kembali ke emoji bawaan perangkat
      img.replaceWith(document.createTextNode(emo));
    };
    img.src = FOLDER + coba[0] + EKSTENSI;
    return img;
  }
  function proses(node) {
    if (node.nodeType === 3) {
      var t = node.nodeValue; if (!t || !RE.test(t)) { RE.lastIndex = 0; return; }
      RE.lastIndex = 0;
      var p = node.parentNode; if (!p || /^(SCRIPT|STYLE|TEXTAREA|INPUT|NOSCRIPT)$/.test(p.nodeName) || p.isContentEditable) return;
      var frag = document.createDocumentFragment(), last = 0, m, ada = false;
      while ((m = RE.exec(t))) {
        var im = buat(m[0]); if (!im) continue;
        frag.appendChild(document.createTextNode(t.slice(last, m.index))); frag.appendChild(im);
        last = m.index + m[0].length; ada = true;
      }
      RE.lastIndex = 0;
      if (!ada) return;
      frag.appendChild(document.createTextNode(t.slice(last)));
      node.replaceWith(frag);
    } else if (node.nodeType === 1 && !/^(SCRIPT|STYLE|TEXTAREA|INPUT|IMG|SVG)$/i.test(node.nodeName) && !node.isContentEditable) {
      for (var c = node.firstChild, n; c; c = n) { n = c.nextSibling; proses(c); }
    }
  }
  var antri = false;
  function jadwal(list) {
    list.forEach(function (n) { if (n.isConnected) proses(n); });
  }
  new MutationObserver(function (ms) {
    if (antri) return; antri = true;
    var nodes = [];
    ms.forEach(function (m) {
      if (m.type === 'characterData') nodes.push(m.target);
      m.addedNodes && m.addedNodes.forEach(function (n) { nodes.push(n); });
    });
    requestAnimationFrame(function () { antri = false; jadwal(nodes); });
  }).observe(root, { childList: true, subtree: true, characterData: true });
  proses(root);
})();
</script>

/* Brightness dimmer */
#dim{position:absolute;inset:0;z-index:299;background:#000;opacity:0;pointer-events:none}
/* App Switcher and Control Center */
#sw-ov,#cc-ov{position:absolute;inset:0;z-index:129;display:none;background:rgba(20,20,24,.55);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)}
#sw-ov.show,#cc-ov.show{display:flex}
#sw-ov{flex-direction:column;justify-content:center}
.sw-row{display:flex;gap:18px;overflow-x:auto;padding:0 40px;scrollbar-width:none}
.sw-row::-webkit-scrollbar{display:none}
.sw-card{flex:none;width:200px;cursor:pointer}
.sw-n{text-align:center;font-size:13px;font-weight:600;margin-bottom:8px}
.sw-c{height:380px;border-radius:26px;background:#2c2c2e;display:flex;align-items:center;justify-content:center}
.sw-none{text-align:center;font-size:18px;opacity:.7}
#cc-ov{display:none;background:rgba(108,108,112,.6);backdrop-filter:blur(34px);-webkit-backdrop-filter:blur(34px)}
#cc-ov.show{display:block}
#screen.ccopen #status,#screen.ccopen #island{opacity:0}
#cc-w{position:absolute;inset:0;color:#fff}
#cc-g{position:absolute;left:42px;top:139px;width:284px;height:360px}
.cc-top{position:absolute;top:20px;width:26px;height:26px;border-radius:50%;background:rgba(160,160,164,.55);display:flex;align-items:center;justify-content:center;cursor:pointer}
.cc-st{position:absolute;top:92px;left:49px;right:47px;height:24px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600}
.cc-st .l,.cc-st .r{display:flex;align-items:center;gap:7px}
.cc-p{position:absolute;border-radius:22px;background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),inset 0 2px 8px rgba(255,255,255,.14),0 6px 18px rgba(0,0,0,.14);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:background .18s,color .18s}
.cc-c{width:61px;height:61px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cc-c.on{background:var(--c,#fff);color:var(--ic,#1c1c1e)}
.cc-k{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.28);cursor:pointer;transition:background .18s}
.cc-k.on{background:var(--c)}
.cc-k.sm{color:rgba(255,255,255,.55);background:rgba(255,255,255,.22)}
.cc-k.sm.on{color:#fff;background:var(--c)}
.cc-s{width:61px;height:135px;border-radius:31px;overflow:hidden;cursor:pointer;touch-action:none}
.cc-s .f{position:absolute;left:0;right:0;bottom:0;background:#fff}
.cc-s .ic{position:absolute;left:0;right:0;top:94px;height:22px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.cc-f{border-radius:30px;cursor:pointer}
.cc-f.on{background:rgba(255,255,255,.34)}
.cc-f .a,.cc-f .b,.cc-f .d{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cc-f .a{left:12px;top:11px;width:21px;height:21px;background:#fff;color:#5e5ce6}
.cc-f .b{left:37px;top:13px;width:17px;height:17px;background:#fff;color:#5e5ce6}
.cc-f .d{left:26px;top:35px;width:13px;height:13px;background:#5ac8c8;color:#fff}
.cc-f .t{position:absolute;left:60px;top:0;height:60px;display:flex;align-items:center;gap:5px;font-size:13px;font-weight:500}
#cc-m .cm-art{position:absolute;left:12px;top:12px;width:47px;height:47px;border-radius:10px;background:rgba(255,255,255,.16);background-size:cover}
#cc-m .cm-ap{position:absolute;left:87px;top:12px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center}
#cc-m .cm-t{position:absolute;left:12px;right:12px;top:64px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cc-m .cm-a{position:absolute;left:12px;right:12px;top:81px;font-size:11px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cc-m .cm-c{position:absolute;left:0;right:0;top:94px;height:38px;display:flex;justify-content:center;align-items:center}
#cc-m .cm-c span{width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#cc-m .cm-c .dim{opacity:.5}
.cc-sd{position:absolute;left:336px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6)}
</style>
<script>
(function () {
  /* ===== BUTTON SETTINGS (you can change these) ===== */

  var ROUND_SHAPE = false;  // false = rounded square like the picture, true = full circle
  /* ================================================== */

  var scr = document.getElementById('screen');
  var btn = document.createElement('div'); btn.id = 'at-btn'; btn.innerHTML = '<i></i>';
  btn.style.setProperty('--idle', IDLE_OPACITY);
  if (ROUND_SHAPE) btn.style.borderRadius = '50%';

  /* ----- The icons inside the menu (white, thin, like iOS) ----- */
  var PH = '<rect x="11" y="2" width="24" height="42" rx="5" fill="#5e5e60" stroke="#fff" stroke-width="2.6"/><rect x="19" y="4.6" width="8" height="1.8" rx=".9" fill="#fff"/>';
  var ICONS = {
    notif: '<svg width="46" height="46" viewBox="0 0 46 46"><path d="M23 7c-7 0-11 5-11 12v7l-4 6v2h30v-2l-4-6v-7c0-7-4-12-11-12z" fill="#fff"/><path d="M19 37.500a4 4 0 0 0 8 0z" fill="#fff"/><circle cx="33" cy="9.500" r="6.200" fill="#fff" stroke="#4a4a4c" stroke-width="2.600"/></svg>',
    switcher: '<svg width="46" height="46" viewBox="0 0 46 46">' + PH + '<rect x="14.500" y="13" width="3" height="27" rx="1" fill="#fff"/><rect x="19" y="13" width="3" height="27" rx="1" fill="#fff"/><rect x="23.500" y="11" width="3" height="29" rx="1" fill="#fff"/><rect x="28" y="13" width="3.500" height="27" rx="1" fill="#fff"/></svg>',
    shot: '<svg width="46" height="46" viewBox="0 0 46 46">' + PH + '<path d="M15.500 17v-3h3M27.500 14h3v3M30.500 29v3h-3M18.500 32h-3v-3" fill="none" stroke="#fff" stroke-width="1.800" stroke-linecap="round"/><rect x="18.500" y="19.500" width="9" height="7.500" rx="1.500" fill="#fff"/><circle cx="23" cy="23.300" r="1.900" fill="#5e5e60"/></svg>',
    reach: '<svg width="46" height="46" viewBox="0 0 46 46">' + PH + [0,1,2,3,4].map(function (r) { return [0,1,2,3].map(function (c) { return '<circle cx="' + (16.500 + c * 4.500) + '" cy="' + (23 + r * 4.200) + '" r="1.250" fill="#fff"/>'; }).join(''); }).join('') + '</svg>',
    cc: '<svg width="46" height="46" viewBox="0 0 46 46"><rect x="8" y="9" width="30" height="13" rx="6.500" fill="none" stroke="#fff" stroke-width="2.600"/><circle cx="15.500" cy="15.500" r="3.600" fill="#fff"/><rect x="8" y="25" width="30" height="13" rx="6.500" fill="#fff"/><circle cx="31" cy="31.500" r="3.600" fill="#4a4a4c"/></svg>',
    home: '<svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="20.500" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2.600"/><circle cx="23" cy="23" r="16.500" fill="#8d8d8f"/><circle cx="23" cy="23" r="13.500" fill="#fff"/></svg>'
  };
  /* label, icon, centre X, centre Y of the icon (inside the 295 x 295 panel) */
  var ITEMS = [
    ['notif', 'Notification Center', ICONS.notif, 147.5, 36],
    ['switcher', 'App Switcher', ICONS.switcher, 64, 94],
    ['shot', 'Screenshot', ICONS.shot, 231, 94],
    ['reach', 'Reachability', ICONS.reach, 64, 186],
    ['home', 'Home', ICONS.home, 147.5, 224],
    ['cc', 'Control Center', ICONS.cc, 231, 186]
  ];

  var ov = document.createElement('div'); ov.id = 'at-ov';
  ov.innerHTML = '<div id="at-menu">' + ITEMS.map(function (it) {
    return '<div class="at-i" data-a="' + it[0] + '" style="left:' + it[3] + 'px;top:' + (it[4] - 23) + 'px"><div class="ic">' + it[2] + '</div>' + it[1] + '</div>';
  }).join('') + '</div>';

  var sw = document.createElement('div'); sw.id = 'sw-ov';
  var cc = document.createElement('div'); cc.id = 'cc-ov';
  var ro = document.createElement('div'); ro.id = 'reach-ov';
  var dim = document.createElement('div'); dim.id = 'dim';
  scr.appendChild(ov); scr.appendChild(sw); scr.appendChild(cc); scr.appendChild(ro); scr.appendChild(dim); scr.appendChild(btn);

  var S = 58, M = 8;
  function W() { return scr.offsetWidth; }
  function H() { return scr.offsetHeight; }
  var x = W() - S - M, y = Math.round(H() * 0.62);
  function place() { btn.style.left = x + 'px'; btn.style.top = y + 'px'; }
  place();
  window.addEventListener('resize', function () {
    x = Math.min(x, W() - S - M); y = Math.min(y, H() - S - M); place();
  });

  /* Fades when left alone, bright again when touched */
  var idleTimer = null;
  function wake() {
    btn.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { btn.classList.add('idle'); }, IDLE_DELAY_MS);
  }
  btn.addEventListener('pointerenter', wake);
  wake();

  /* ----- What each button does ----- */
  function resetReach() { scr.classList.remove('reach'); }
  ro.addEventListener('click', resetReach);

  function goHome() {
    resetReach();
    if (state === 'lock') { unlock(); return; }
    if (document.getElementById('app').classList.contains('open')) closeApp();
  }
  function notificationCenter() { resetReach(); lockPhone(); }

  function appSwitcher() {
    var list = recents.slice(0, 6);
    sw.innerHTML = list.length
      ? '<div class="sw-row">' + list.map(function (id) { return '<div class="sw-card" data-id="' + id + '"><div class="sw-n">' + APPS[id].n + '</div><div class="sw-c">' + iconTile(id, 72) + '</div></div>'; }).join('') + '</div>'
      : '<div class="sw-none">No Recent Apps</div>';
    sw.classList.add('show');
  }
  sw.addEventListener('click', function (e) {
    var c = e.target.closest('.sw-card');
    sw.classList.remove('show');
    if (c) { setView('home'); openApp(c.dataset.id); }
  });

  function screenshot() {
    var f = document.createElement('div'); f.id = 'shot'; scr.appendChild(f);
    setTimeout(function () { f.remove(); }, 450);
  }

  function reachability() { scr.classList.add('reach'); }

  /* ===== Control Center (iOS 26 layout) ===== */
  var BATTERY = 96;  // battery percentage shown in Control Center
  var CCS = { air: true, wifi: true, bt: true, rot: true, torch: false, lowp: false, focus: false, bright: 1 - ((parseFloat(dim.style.opacity) || 0) / 0.6), vol: PLAYER.volume };
  var TOGGLES = ['air', 'wifi', 'bt', 'rot', 'torch', 'lowp', 'focus'];
  function svg(inner, s, o) {
    o = o || {};
    return '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="' + (o.fill || 'none') + '" stroke="' + (o.stroke || 'currentColor') + '" stroke-width="' + (o.sw || 1.9) + '" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
  }
  var FL = { fill: 'currentColor', stroke: 'none' };
  var G = {
    plus: function (s) { return svg('<path d="M12 5v14M5 12h14"/>', s, { sw: 2.4 }); },
    power: function (s) { return svg('<path d="M12 3v8.5"/><path d="M6.8 6.6a8 8 0 1 0 10.4 0"/>', s, { sw: 2.4 }); },
    plane: function (s) { return ico('plane', s, { fill: 'currentColor', sw: 1.2 }); },
    wifi: function (s) { return ico('wifi', s, { sw: 2.4 }); },
    bt: function (s) { return ico('bluetooth', s, { sw: 2.4 }); },
    airdrop: function (s) { return svg('<circle cx="12" cy="14" r="1.6" fill="currentColor" stroke="none"/><path d="M8.8 17.2a4.5 4.5 0 1 1 6.4 0"/><path d="M5.8 20.2a8.7 8.7 0 1 1 12.4 0"/>', s, { sw: 2 }); },
    cell: function (s) { return svg('<rect x="3" y="14" width="4" height="7" rx="1"/><rect x="10" y="9" width="4" height="12" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/>', s, FL); },
    link: function (s) { return svg('<path d="M10 14a4 4 0 0 0 5.700 0l3-3a4 4 0 0 0-5.700-5.700l-1 1"/><path d="M14 10a4 4 0 0 0-5.700 0l-3 3a4 4 0 0 0 5.700 5.700l1-1"/><path d="M4 4l16 16"/>', s, { sw: 2 }); },
    globe: function (s) { return ico('globe', s, { sw: 2 }); },
    lockrot: function (s) { return svg('<path d="M19 12a7 7 0 1 1-2.100-5"/><path d="M20.500 3.500v5.200h-5.200"/><rect x="9" y="11.200" width="6" height="5" rx="1.200" fill="currentColor" stroke="none"/><path d="M10.200 11.200V9.900a1.800 1.800 0 0 1 3.600 0v1.300" stroke-width="1.500"/>', s, { sw: 2 }); },
    mirror: function (s) { return svg('<rect x="2.500" y="4" width="13.500" height="10.500" rx="2.600"/><rect x="8" y="9.500" width="13.500" height="10.500" rx="2.600"/>', s, { sw: 2.200 }); },
    sun: function (s) { return svg('<circle cx="12" cy="12" r="4.300" fill="currentColor" stroke="none"/><path d="M12 2.500v2M12 19.500v2M2.500 12h2M19.500 12h2M5.300 5.300l1.400 1.400M17.300 17.300l1.400 1.400M5.300 18.700l1.400-1.400M17.300 6.700l1.400-1.400"/>', s, { sw: 1.800 }); },
    spk: function (s) { return svg('<path d="M4 9.500v5h3.600l4.600 4V5.500l-4.600 4z" fill="currentColor" stroke="none"/><path d="M15.500 9a4 4 0 0 1 0 6"/><path d="M18 6.500a7.500 7.500 0 0 1 0 11"/>', s, { sw: 1.800 }); },
    mute: function (s) { return svg('<path d="M4 9.500v5h3.600l4.600 4V5.500l-4.600 4z" fill="currentColor" stroke="none"/><path d="M4.500 3.500l15 17"/>', s, { sw: 2 }); },
    torch: function (s) { return svg('<path d="M8 2h8v4l-1.500 2.500V21a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2V8.500L8 6z" fill="currentColor" stroke="none"/><circle cx="12" cy="13" r="1.500" fill="#8a8a8e" stroke="none"/>', s, FL); },
    qr: function (s) { return svg('<path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><rect x="7.500" y="7.500" width="3" height="3"/><rect x="13.500" y="7.500" width="3" height="3"/><rect x="7.500" y="13.500" width="3" height="3"/><path d="M13.500 13.500h3v3"/>', s, { sw: 1.800 }); },
    batt: function (s) { return svg('<rect x="2.500" y="7" width="17" height="10" rx="3"/><path d="M21.500 10.500v3"/><rect x="4.500" y="9" width="4" height="6" rx="1.200" fill="currentColor" stroke="none"/>', s, { sw: 1.800 }); },
    heart: function (s) { return ico('heart', s, { fill: 'currentColor', sw: 1 }); },
    note: function (s) { return svg('<path d="M9 18V6l10-2v12"/><circle cx="6.500" cy="18" r="2.500" fill="currentColor"/><circle cx="16.500" cy="16" r="2.500" fill="currentColor"/>', s, { sw: 1.800 }); },
    radio: function (s) { return svg('<circle cx="12" cy="10" r="1.500" fill="currentColor"/><path d="M8.500 6.500a5 5 0 0 0 0 7M15.500 6.500a5 5 0 0 1 0 7M5.500 4a9 9 0 0 0 0 12M18.500 4a9 9 0 0 1 0 12M12 12v8"/>', s, { sw: 1.600 }); },
    prev: function (s) { return svg('<path d="M12 6v12L3 12zM21 6v12l-9-6z"/>', s, { fill: 'currentColor', sw: 1.600 }); },
    next: function (s) { return svg('<path d="M12 6v12l9-6zM3 6v12l9-6z"/>', s, { fill: 'currentColor', sw: 1.600 }); },
    play: function (s) { return svg('<path d="M7 4.500v15l12-7.500z"/>', s, { fill: 'currentColor', sw: 1.600 }); },
    pause: function (s) { return svg('<rect x="6" y="4.500" width="4" height="15" rx="1.200"/><rect x="14" y="4.500" width="4" height="15" rx="1.200"/>', s, FL); },
    airplay: function (s) { return svg('<path d="M7.600 16.400a6 6 0 1 1 8.800 0"/><path d="M4.600 19.200a10 10 0 1 1 14.800 0"/><path d="M12 14l5 6.500H7z" fill="currentColor" stroke="none"/>', s, { sw: 1.800 }); },
    moon: function (s) { return ico('moon', s, { fill: 'currentColor', sw: 0 }); },
    bed: function (s) { return svg('<path d="M3 18V6.500M3 14.500h18V18M21 14.500V12a3 3 0 0 0-3-3h-6v5.500"/>', s, { sw: 2.200 }); },
    chev: function (s) { return svg('<path d="M8 9.500l4-4 4 4M8 14.500l4 4 4-4"/>', s, { sw: 2.200 }); }
  };

  function battery() {
    var w = Math.round(26 * BATTERY / 100);
    return '<svg width="31" height="14" viewBox="0 0 31 14"><rect x="0" y="0" width="26" height="14" rx="4.500" fill="rgba(255,255,255,.35)"/><rect x="0" y="0" width="' + w + '" height="14" rx="4.500" fill="#fff"/><rect x="27.500" y="4.500" width="2.200" height="5" rx="1" fill="rgba(255,255,255,.55)"/></svg>';
  }
  function k(id, x, y, size, icon, on, color, sm) {
    return '<div class="cc-k' + (sm ? ' sm' : '') + (on ? ' on' : '') + '" data-t="' + id + '" style="left:' + x + 'px;top:' + y + 'px;width:' + size + 'px;height:' + size + 'px;--c:' + (color || '#fff') + '">' + icon + '</div>';
  }
  function circle(id, x, y, icon, on, color, ic) {
    return '<div class="cc-p cc-c' + (on ? ' on' : '') + '" data-t="' + id + '" style="left:' + x + 'px;top:' + y + 'px;--c:' + (color || '#fff') + ';--ic:' + (ic || '#1c1c1e') + '">' + icon + '</div>';
  }
  function slider(id, x) {
    return '<div class="cc-p cc-s" id="' + id + '" style="left:' + x + 'px;top:149px"><div class="f"></div><div class="ic"></div></div>';
  }
  function mediaHTML() {
    var P = PLAYER, t = P.track, st = P.started;
    return '<div class="cm-art" style="' + (st ? 'background:' + bg(t.cover || CONFIG.music.color) : '') + '"></div>' +
      '<div class="cm-ap">' + G.airplay(18) + '</div>' +
      (st ? '<div class="cm-t">' + esc(t.title) + '</div><div class="cm-a">' + esc(t.artist) + '</div>' : '<div class="cm-t" style="top:71px">Not Playing</div>') +
      '<div class="cm-c"><span data-m="prev" class="' + (st ? '' : 'dim') + '">' + G.prev(26) + '</span><span data-m="toggle">' + (P.playing ? G.pause(30) : G.play(32)) + '</span><span data-m="next" class="' + (st ? '' : 'dim') + '">' + G.next(26) + '</span></div>';
  }
  function updateMedia() {
    var m = cc.querySelector('#cc-m');
    if (m) m.innerHTML = mediaHTML();
  }
  PLAYER.onChange(function (kind) { if (kind !== 'tick' && cc.classList.contains('show')) updateMedia(); });

  function bindSlider(id, get, set, paint) {
    var el = cc.querySelector('#' + id), f = el.querySelector('.f'), ic = el.querySelector('.ic'), down = false;
    function draw() { var v = get(); f.style.height = (v * 100) + '%'; ic.innerHTML = paint(v); ic.style.color = v > 0.2 ? '#8a8a8e' : '#fff'; }
    function upd(e) {
      var r = el.getBoundingClientRect();
      set(Math.max(0, Math.min(1, 1 - (e.clientY - r.top) / r.height)));
      draw();
    }
    el.addEventListener('pointerdown', function (e) { down = true; el.setPointerCapture(e.pointerId); upd(e); });
    el.addEventListener('pointermove', function (e) { if (down) upd(e); });
    el.addEventListener('pointerup', function () { down = false; });
    el.addEventListener('pointercancel', function () { down = false; });
    draw();
  }

  function drawCC() {
    cc.innerHTML = '<div id="cc-w">' +
      '<div class="cc-top" style="left:41px">' + G.plus(16) + '</div><div class="cc-top" style="left:301px">' + G.power(15) + '</div>' +
      '<div class="cc-st"><span class="l">' + (CCS.air ? G.plane(20) : '') + (CCS.wifi ? G.wifi(20) : '') + '</span><span class="r">' + (CCS.rot ? G.lockrot(16) : '') + '<span>' + BATTERY + '%</span>' + battery() + '</span></div>' +
      '<div id="cc-g">' +
        '<div class="cc-p" style="left:0;top:0;width:135px;height:135px">' +
          k('air', 12, 12, 49, G.plane(24), CCS.air, '#f3994a') +
          k('drop', 74, 12, 49, G.airdrop(26), false) +
          k('wifi', 12, 74, 49, G.wifi(24), CCS.wifi, '#3b8ff5') +
          k('cell', 74, 74, 22, G.cell(12), !CCS.air, '#34c759', true) +
          k('bt', 101, 74, 22, G.bt(12), CCS.bt, '#3b8ff5', true) +
          k('link', 74, 101, 22, G.link(12), false, '#fff', true) +
          k('globe', 101, 101, 22, G.globe(12), false, '#fff', true) +
        '</div>' +
        '<div class="cc-p" id="cc-m" style="left:149px;top:0;width:135px;height:135px">' + mediaHTML() + '</div>' +
        circle('rot', 0, 149, G.lockrot(30), CCS.rot, '#fff', '#ee6b6b') +
        circle('mirror', 74, 149, G.mirror(28), false) +
        slider('cc-br', 149) + slider('cc-vo', 224) +
        '<div class="cc-p cc-f' + (CCS.focus ? ' on' : '') + '" data-t="focus" style="left:0;top:224px;width:135px;height:60px"><div class="a">' + G.moon(13) + '</div><div class="b">' + G.bed(11) + '</div><div class="d">' + svg('<rect x="8" y="5" width="8" height="14" rx="1.500"/>', 8, { sw: 2.400 }) + '</div><div class="t">Focus ' + G.chev(13) + '</div></div>' +
        circle('torch', 0, 299, G.torch(26), CCS.torch) +
        circle('qr', 74, 299, G.qr(28), false) +
        circle('lowp', 149, 299, G.batt(28), CCS.lowp, '#ffd60a') +
      '</div>' +
      '<div class="cc-sd" style="top:338px;color:#fff">' + G.heart(22) + '</div><div class="cc-sd" style="top:388px">' + G.note(22) + '</div><div class="cc-sd" style="top:436px">' + G.radio(22) + '</div>' +
      '</div>';
    bindSlider('cc-br', function () { return CCS.bright; }, function (v) { CCS.bright = v; dim.style.opacity = (1 - v) * 0.6; }, function () { return G.sun(18); });
    bindSlider('cc-vo', function () { return CCS.vol; }, function (v) { CCS.vol = v; PLAYER.setVolume(v); }, function (v) { return v === 0 ? G.mute(20) : G.spk(20); });
  }
  function controlCenter() { CCS.vol = PLAYER.volume; drawCC(); cc.classList.add('show'); scr.classList.add('ccopen'); }
  cc.addEventListener('click', function (e) {
    var m = e.target.closest('[data-m]');
    if (m) {
      if (m.dataset.m === 'toggle') PLAYER.toggle();
      else if (PLAYER.started) { if (m.dataset.m === 'next') PLAYER.next(); else PLAYER.prev(); }
      return;
    }
    var t = e.target.closest('[data-t]');
    if (t) {
      if (TOGGLES.indexOf(t.dataset.t) > -1) { CCS[t.dataset.t] = !CCS[t.dataset.t]; drawCC(); }
      return;
    }
    if (e.target === cc || e.target.id === 'cc-w' || e.target.id === 'cc-g') { cc.classList.remove('show'); scr.classList.remove('ccopen'); }
  });

  var ACTIONS = { notif: notificationCenter, switcher: appSwitcher, shot: screenshot, reach: reachability, home: goHome, cc: controlCenter };

  /* Open and close the menu */
  function openMenu() { ov.classList.add('show'); btn.style.opacity = '0'; btn.style.pointerEvents = 'none'; }
  function closeMenu() { ov.classList.remove('show'); btn.style.opacity = ''; btn.style.pointerEvents = ''; wake(); }
  ov.addEventListener('click', function (e) {
    var it = e.target.closest('.at-i');
    closeMenu();
    if (!it) return;
    setTimeout(function () { ACTIONS[it.dataset.a](); }, 120);
  });

  /* The button can be dragged, then snaps to the left or right edge */
  var drag = null, moved = false;
  btn.addEventListener('pointerdown', function (e) {
    wake();
    var r = scr.getBoundingClientRect(), k = r.width / W();
    drag = { k: k, r: r, ox: (e.clientX - r.left) / k - x, oy: (e.clientY - r.top) / k - y, sx: e.clientX, sy: e.clientY };
    moved = false; btn.setPointerCapture(e.pointerId); btn.classList.add('drag');
  });
  btn.addEventListener('pointermove', function (e) {
    if (!drag) return;
    if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 6) moved = true;
    if (!moved) return;
    wake();
    x = Math.min(W() - S - 2, Math.max(2, (e.clientX - drag.r.left) / drag.k - drag.ox));
    y = Math.min(H() - S - 2, Math.max(2, (e.clientY - drag.r.top) / drag.k - drag.oy));
    place();
  });
  btn.addEventListener('pointerup', function () {
    if (!drag) return;
    btn.classList.remove('drag'); drag = null;
    if (moved) { x = (x + S / 2 < W() / 2) ? M : W() - S - M; place(); wake(); }
    else openMenu();
  });
  btn.addEventListener('pointercancel', function () { drag = null; btn.classList.remove('drag'); });
})();
</script>
<!-- ===== ASSISTIVE TOUCH: END ===== -->

</body>
</html>
